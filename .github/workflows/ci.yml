name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP lint
        run: for f in reader-membership-toolkit.php includes/*.php; do php -l "$f"; done
      - name: PHP tests
        run: php tests/php/run.php
      - name: JS tests
        run: npm test
